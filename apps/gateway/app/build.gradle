plugins { id 'com.android.application' }
android {
    namespace 'mg.kajypay.gateway'
    compileSdk 34
    defaultConfig {
        applicationId "mg.kajypay.gateway"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "0.8.0"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        stable {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "absent.p12")
            storePassword System.getenv("KEYSTORE_PASS") ?: ""
            keyAlias "kajypay"
            keyPassword System.getenv("KEYSTORE_PASS") ?: ""
            storeType "pkcs12"
        }
    }
    buildTypes {
        debug { if (System.getenv("KEYSTORE_FILE") != null) signingConfig signingConfigs.stable }
        release {
            minifyEnabled false
            if (System.getenv("KEYSTORE_FILE") != null) signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
